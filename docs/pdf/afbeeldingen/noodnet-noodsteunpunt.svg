</defs><rect width="1200" height="700" fill="#ffffff"/><text x="40" y="52" class="h">Noodsteunpunt</text><text x="40" y="78" class="s" style="font-size:15px">Draagbaar station van een zendamateur, op een accu. Vangt de meldingen van vrijwilligers op (LoRa) en zendt ze door naar de hulpdiensten (2 m).</text><line x1="150" y1="200" x2="150" y2="110" stroke="#30363f" stroke-width="5" stroke-linecap="round"/><line x1="140" y1="124" x2="160" y2="124" stroke="#30363f" stroke-width="3"/><line x1="150" y1="200" x2="150" y2="214" stroke="#30363f" stroke-width="4"/><use href="#set" x="60" y="214"/><text x="160" y="330" text-anchor="middle" class="t" style="font-weight:700">2 m-transceiver</text><text x="160" y="348" text-anchor="middle" class="s">eigen set van de zendamateur</text><g transform="translate(178,140) scale(1.1,1.1)" stroke="#c0392b"><use href="#golf" x="0" y="-30"/></g><text x="240" y="122" class="lbl" style="fill:#c0392b">2 m · frequentie gemeente</text><text x="240" y="140" class="s">AX.25 packet, 1200 baud</text><text x="240" y="158" class="s">leesbaar, eigen roepnaam</text><text x="240" y="176" class="s">↔ Eindposten</text><use href="#pi" x="470" y="300"/><text x="555" y="434" text-anchor="middle" class="t" style="font-weight:700">Raspberry Pi 4 of 5</text><text x="555" y="452" text-anchor="middle" class="s">Raspberry Pi OS Lite</text><path d="M260,262 C360,262 360,340 470,340" fill="none" stroke="#7f8c8d" stroke-width="3" stroke-linecap="round"/><text x="365" y="285" text-anchor="middle" class="lbl" style="fill:#7f8c8d">USB: geluid + PTT</text><text x="365" y="302" text-anchor="middle" class="s">ingebouwd of via interface</text><use href="#rnode" x="800" y="170"/><use href="#rnode" x="800" y="400"/><text x="842" y="302" text-anchor="middle" class="t" style="font-weight:700">RNode 433 MHz</text><text x="842" y="532" text-anchor="middle" class="t" style="font-weight:700">RNode 868 MHz</text><path d="M640,335 C720,335 720,257 800,257" fill="none" stroke="#7f8c8d" stroke-width="3" stroke-linecap="round"/><text x="735" y="290" text-anchor="middle" class="lbl" style="fill:#7f8c8d">USB</text><path d="M640,368 C720,368 720,487 800,487" fill="none" stroke="#7f8c8d" stroke-width="3" stroke-linecap="round"/><text x="735" y="432" text-anchor="middle" class="lbl" style="fill:#7f8c8d">USB</text><g transform="translate(878,195) scale(0.85,0.85)" stroke="#1e8449"><use href="#golf" x="0" y="-30"/></g><g transform="translate(878,425) scale(0.85,0.85)" stroke="#1e8449"><use href="#golf" x="0" y="-30"/></g><text x="945" y="190" class="lbl" style="fill:#1e8449">LoRa 434,100 MHz</text><text x="945" y="208" class="s">max. 10 mW</text><text x="945" y="226" class="s">↔ telefoons van vrijwilligers</text><text x="945" y="420" class="lbl" style="fill:#1e8449">LoRa 869,525 MHz</text><text x="945" y="438" class="s">max. 500 mW, 10% zendtijd</text><text x="945" y="456" class="s">↔ telefoons van vrijwilligers</text><use href="#accu" x="100" y="560"/><text x="160" y="648" text-anchor="middle" class="t" style="font-weight:700">Accu</text><text x="160" y="666" text-anchor="middle" class="s">bijv. LiFePO4</text><rect x="330" y="568" width="110" height="50" rx="8" fill="#f4f6f8" stroke="#8a9199" stroke-width="1.5"/><text x="385" y="590" text-anchor="middle" class="t" style="font-weight:700">5 V-omvormer</text><text x="385" y="608" text-anchor="middle" class="s">Pi 5: 5 A</text><path d="M160,560 L160,410 L160,306" fill="none" stroke="#b9770e" stroke-width="3.5" stroke-linecap="round"/><text x="132" y="480" text-anchor="middle" class="lbl" style="fill:#b9770e">12 V</text><path d="M220,593 L330,593" fill="none" stroke="#b9770e" stroke-width="3.5" stroke-linecap="round"/><path d="M440,593 C520,593 520,500 520,412" fill="none" stroke="#b9770e" stroke-width="3.5" stroke-linecap="round"/><text x="535" y="520" text-anchor="start" class="lbl" style="fill:#b9770e">5 V</text><use href="#wifi" x="590" y="470"/><use href="#tel" x="650" y="560" width="58" height="107"/><path d="M610,502 C610,560 630,600 650,610" fill="none" stroke="#2471a3" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><text x="725" y="586" class="lbl" style="fill:#2471a3">Eigen wifi-hotspot</text><text x="725" y="604" class="m">Noodnet-PD3PAM-1</text><text x="725" y="624" class="s">beheerpagina: http://10.42.0.1:8080</text><text x="725" y="642" class="s">app downloaden: http://10.42.0.1</text><text x="725" y="660" class="s">werkt zonder internet</text><rect x="420" y="112" width="300" height="152" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="1.5"/><text x="434" y="136" class="t" style="font-weight:700">Software op de Pi</text><text x="434" y="160" class="s">Direwolf – 2 m packet-modem</text><text x="434" y="181" class="s">Reticulum + LXMF – LoRa-netwerk</text><text x="434" y="202" class="s">Noodnet-brug – LoRa ⇄ 2 m, ACK, herhalen</text><text x="434" y="223" class="s">Beheerpagina, back-up, kaart (QR)</text><text x="434" y="244" class="s">Wifi-hotspot – altijd aan</text><line x1="555" y1="264" x2="555" y2="300" stroke="#8a9199" stroke-width="1.5" stroke-dasharray="4 4"/></svg>