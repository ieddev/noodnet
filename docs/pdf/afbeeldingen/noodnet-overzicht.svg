<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Overzicht van Noodnet"><title>Overzicht van Noodnet</title><defs>
<style>
 text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#1d2530}
 .t{font-size:15px} .s{font-size:13px;fill:#5b6573} .k{font-size:18px;font-weight:700}
 .h{font-size:24px;font-weight:700} .w{fill:#fff} .m{font-family:Consolas,Menlo,monospace;font-size:13px}
 .lbl{font-size:13px;font-weight:600}
</style>
<marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
 <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>

<!-- Transceiver 200x92 -->
<symbol id="set" viewBox="0 0 200 92" width="200" height="92">
 <rect x="1" y="1" width="198" height="90" rx="9" fill="#2b313a" stroke="#14181d" stroke-width="2"/>
 <rect x="14" y="16" width="96" height="34" rx="4" fill="#9fd8b0"/>
 <text x="62" y="40" text-anchor="middle" style="font-family:Consolas,Menlo,monospace;font-size:17px;font-weight:700;fill:#13351f">144.925</text>
 <circle cx="158" cy="44" r="24" fill="#3c444f" stroke="#59636f" stroke-width="3"/>
 <circle cx="158" cy="44" r="7" fill="#59636f"/>
 <rect x="14" y="62" width="18" height="10" rx="2" fill="#59636f"/><rect x="38" y="62" width="18" height="10" rx="2" fill="#59636f"/>
 <rect x="62" y="62" width="18" height="10" rx="2" fill="#59636f"/><rect x="86" y="62" width="18" height="10" rx="2" fill="#59636f"/>
</symbol>

<!-- Raspberry Pi (generieke printplaat) 170x112 -->
<symbol id="pi" viewBox="0 0 170 112" width="170" height="112">
